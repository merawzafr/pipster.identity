services:
  identity:
    build:
      context: .
      dockerfile: Dockerfile.debug
    image: pipster-identity:dev
    container_name: pipster-identity
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=pipster_identity;Username=postgres;Password=postgres
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Information
      - Logging__LogLevel__Duende=Information
    ports:
      - "5000:80"
    depends_on:
      - postgres
    networks:
      - pipster-network
    # Disable healthcheck to avoid blocking startup
    healthcheck:
      disable: true

  postgres:
    ports:
      - "5432:5432"
    # Simplify postgres healthcheck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  pipster-network:
    driver: bridge